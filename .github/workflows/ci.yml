name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the PR's run in progress. Every push to main gets a run of its own
# (staging deploys from it), so main's runs are never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests from forks run this too: keep the token read-only.
permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node .github/test-shards.ts check

  # The suite in parallel jobs, one per shard of `.github/test-shards.ts` (the lint job checks
  # that every test file is in exactly one).
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: arena
          - shard: arena-backstop
          - shard: arena-backstop-memory
          - shard: arena-backstop-restarts
          - shard: web
          - shard: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node .github/test-shards.ts run ${{ matrix.shard }}

  # One result for the whole run, for branch protection to require ("check", as the single job
  # used to be called).
  check:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

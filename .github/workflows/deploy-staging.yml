name: Deploy staging

# Runs after CI passes on main (or manually). No-ops until the Cloudflare secrets are set:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template (Workers Scripts, R2, Routes) plus
#                          Account D1: Edit and Queues: Edit; zone zerosnake.dev with
#                          Workers Routes: Edit and DNS: Edit (custom domains)
#   CLOUDFLARE_ACCOUNT_ID
# Deploys the public environment (zerosnake.dev, `env.staging`). See "Operations" in README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured; skipping staging deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://zerosnake.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup

      - name: Refuse placeholder resource IDs
        run: |
          if grep -n "00000000-0000-0000-0000-000000000000" apps/*/wrangler.jsonc; then
            echo "::error::Replace the PLACEHOLDER IDs in apps/*/wrangler.jsonc before deploying."
            exit 1
          fi

      # Build the site before anything changes: migrations run before the new site is live, so
      # the old site serves against the new schema until "Deploy web"; keep that window short.
      - name: Build web
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: staging
        run: pnpm build

      # Arena first: the site binds to its Durable Objects by script name.
      - name: Deploy arena
        working-directory: apps/arena
        run: pnpm exec wrangler deploy --env staging

      - name: Apply D1 migrations
        if: hashFiles('apps/web/migrations/*.sql') != ''
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy web
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: staging
        run: pnpm exec wrangler deploy

      - name: Smoke check
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://api.zerosnake.dev/health
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://zerosnake.dev/api/health

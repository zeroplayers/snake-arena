name: Release CLI

# Publishes packages/cli (`zerosnake`) to npm when a `cli-v<version>` tag is pushed, e.g.
#   git tag cli-v0.1.1 && git push origin cli-v0.1.1
# The tag must match the version in packages/cli/package.json and point at a commit on main.
#
# No npm token: npm trusted publishing (OIDC) with provenance. The first release is published by
# hand (npm only lets you add a trusted publisher to a package that exists); then, on
# npmjs.com → zerosnake → Settings → Trusted publishing, add GitHub Actions with
#   organization/user zeroplayers, repository snake-arena, workflow release-cli.yml, environment npm.
# Give the `npm` environment a required reviewer, and a tag ruleset so only admins create `cli-v*`
# tags (docs/launch/checklist.md, step 4). Until trusted publishing is set up, "Publish" fails.
#
# Two jobs: `build` installs dependencies and runs tests without an OIDC token; `publish` only
# uploads the tarball `build` made, so no dependency code runs where the token can be minted.
# Actions are pinned by commit (the tag in the comment).
on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Tag is on main and matches the package version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/cli version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter zerosnake typecheck
      # The CLI's tests include src/pack.test.ts: pack, install outside the monorepo, init, sim, test.
      - run: pnpm vitest run packages/cli

      # pnpm pack runs prepack (the build) and rewrites the workspace:* devDependencies.
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/zerosnake-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/zerosnake
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
          path: pack
      # Trusted publishing needs npm 11.5.1+; current Node 24 releases bundle a newer one.
      - run: npm --version
      - name: Publish
        # "./": without it npm reads pack/zerosnake-x.tgz as a GitHub owner/repo shorthand.
        run: npm publish ./pack/zerosnake-*.tgz --access public --provenance
